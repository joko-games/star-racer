<?xml version="1.0" encoding="UTF-8"?>
<!-- The studio's logo (2026-11-24): the user's own mark, a black disk in a cyan neon ring, its
     line doubled as if drawn by hand, redrawn as it is, with a gamepad seen from above inside it
     in the same neon. Measured on the 128 px original: the ring 8 px wide at the edge, #72fafc
     outside fading to #62d6d8 inside. tools/icon renders it to studio.png (docs/logo.md). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <g id="figure" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <!-- The gamepad's body, two grips, symmetric about the middle. -->
      <path d="M 170 200 H 342 C 380 200 400 220 410 255 L 432 330 C 440 362 412 378 392 360
               L 352 322 C 345 316 338 314 330 314 H 182 C 174 314 167 316 160 322 L 120 360
               C 100 378 72 362 80 330 L 102 255 C 112 220 132 200 170 200 Z"/>
      <!-- The cross on the left, the four buttons on the right, the two sticks below. -->
      <path d="M 180 230 V 274 M 158 252 H 202"/>
      <circle cx="332" cy="230" r="8"/>
      <circle cx="354" cy="252" r="8"/>
      <circle cx="310" cy="252" r="8"/>
      <circle cx="332" cy="274" r="8"/>
      <circle cx="222" cy="292" r="12"/>
      <circle cx="290" cy="292" r="12"/>
    </g>
  </defs>

  <!-- The disk. -->
  <circle cx="256" cy="256" r="232" fill="#000000"/>

  <!-- The ring: a glow, then two lines a hair apart, as the original's. -->
  <g fill="none">
    <circle cx="256" cy="256" r="238" stroke="#72fafc" stroke-width="30" filter="url(#glow)"
            opacity="0.9"/>
    <circle cx="255" cy="257" r="240" stroke="#72fafc" stroke-width="14"/>
    <circle cx="257" cy="255" r="234" stroke="#62d6d8" stroke-width="16"/>
  </g>

  <!-- The figure, in the same neon. -->
  <use href="#figure" stroke="#72fafc" stroke-width="26" filter="url(#glow)" opacity="0.8"/>
  <use href="#figure" stroke="#62d6d8" stroke-width="14"/>
  <use href="#figure" stroke="#b8fdff" stroke-width="4"/>
</svg>
